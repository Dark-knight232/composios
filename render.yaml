services:
  - type: web
    name: composio-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements-backend.txt && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COMPOSIO_API_KEY
        sync: false
      - key: NIM_API_KEY
        sync: false
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.11"